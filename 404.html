<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="10;url=/">
  <title>404 · Página no encontrada · WhiteMooncy</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      background: var(--page-bg);
      color: #fff;
      font-family: var(--font-primary);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }
    .sakura {
      position: absolute;
      top: 0; right: 0;
      width: 70%; height: 100%;
      background: url('assets/sakura-branch.png') right top / contain no-repeat;
      opacity: 0.85;
      pointer-events: none;
    }
    .overlay {
      position: absolute; inset: 0;
      background:
        linear-gradient(to bottom, transparent 35%, rgba(0,0,0,0.9) 100%),
        linear-gradient(to right, #080001 0%, rgba(13,0,2,0.85) 25%, rgba(13,0,2,0.2) 45%, transparent 65%);
      pointer-events: none;
    }
    main {
      position: relative;
      z-index: 2;
      max-width: 640px;
      padding: var(--space-12) var(--space-8);
      text-align: left;
    }
    .code {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      font-family: var(--font-primary);
      font-weight: 800;
      font-size: clamp(6rem, 18vw, 11rem);
      line-height: 0.9;
      background: linear-gradient(135deg, #ff416c 0%, #ff9db1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.04em;
      margin: 0 0 var(--space-4);
    }
    h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700; margin: 0 0 var(--space-3); }
    p { font-size: 1.05rem; line-height: 1.7; color: rgba(255,255,255,0.8); margin: 0 0 var(--space-8); max-width: 460px; }
    .actions { display: flex; gap: var(--space-3); flex-wrap: wrap; }
    .btn-primary, .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: 600; font-size: 0.95rem;
      text-decoration: none;
      transition: all 200ms cubic-bezier(0.4,0,0.2,1);
      min-height: 44px;
      box-sizing: border-box;
    }
    .btn-primary {
      background: #ff416c;
      color: #fff;
      border: 2px solid #ff416c;
    }
    .btn-primary:hover {
      background: #cc3552; border-color: #cc3552;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255,65,108,0.4);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.85);
      border: 1.5px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(8px);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.45);
      color: #fff;
      transform: translateY(-2px);
    }
    .meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: var(--space-4);
      padding: 6px 14px;
      background: rgba(255,65,108,0.12);
      border: 1px solid rgba(255,65,108,0.3);
      border-radius: 9999px;
      color: var(--color-primary-lighter);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .meta i { color: var(--color-primary); }
  </style>
</head>
<body>
  <div class="sakura"></div>
  <div class="overlay"></div>
  <main>
    <span class="meta"><i class="fas fa-compass"></i> Te perdiste</span>
    <p class="code">404</p>
    <h1>Esta página no existe</h1>
    <p>Tal vez se la llevó el viento, o se cayó como un pétalo de sakura. Volvé al inicio y seguimos.</p>
    <div class="actions">
      <a href="/" class="btn-primary">
        <i class="fas fa-home"></i> Ir al inicio
      </a>
      <a href="mailto:mateo.villablanca.gall@gmail.com" class="btn-secondary">
        <i class="fas fa-envelope"></i> Avisarme del error
      </a>
    </div>
  </main>
</body>
</html>
