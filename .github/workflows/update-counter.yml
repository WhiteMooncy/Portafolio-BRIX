name: Update visitor count

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch count from Apps Script
        run: |
          RESPONSE=$(curl -sf --max-time 15 "${{ secrets.APP_SCRIPT_URL }}" || echo '{"users":"0"}')
          echo "$RESPONSE" > counter.json
          echo "Response: $RESPONSE"

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add counter.json
          git diff --staged --quiet || (git commit -m "chore: update visitor count" && git push)
