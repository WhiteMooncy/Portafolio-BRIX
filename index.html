  <script>
    (function() {
      function updateThemeAriaLabel(theme) {
        var btn = document.getElementById('theme-toggle');
        if (btn) btn.setAttribute('aria-label', theme === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
      }
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('wmcy-theme', next);
        updateThemeAriaLabel(next);
      });
      updateThemeAriaLabel(document.documentElement.getAttribute('data-theme') || 'dark');
    })();
  </script>
